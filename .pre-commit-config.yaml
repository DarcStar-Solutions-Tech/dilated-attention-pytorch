repos:
- repo: https://github.com/astral-sh/ruff-pre-commit
  rev: v0.8.4
  hooks:
  - id: ruff
    args: [--fix, --exit-non-zero-on-fix]
    exclude: |
      (?x)^(
        src/dilated_attention_pytorch/kernels/hilbert_attention_core\.py|
        src/dilated_attention_pytorch/kernels/hilbert_attention_unified\.py|
        src/dilated_attention_pytorch/kernels/hilbert_attention_unified_optimized\.py|
        src/dilated_attention_pytorch/kernels/hilbert_attention_unified_optimized_enhanced\.py
      )$
  - id: ruff-format
    exclude: |
      (?x)^(
        src/dilated_attention_pytorch/kernels/hilbert_attention_core\.py|
        src/dilated_attention_pytorch/kernels/hilbert_attention_unified\.py|
        src/dilated_attention_pytorch/kernels/hilbert_attention_unified_optimized\.py|
        src/dilated_attention_pytorch/kernels/hilbert_attention_unified_optimized_enhanced\.py
      )$

- repo: local
  hooks:
  - id: smart-linting
    name: Smart Linting Fixes
    entry: python scripts/pre_commit_smart_fix.py
    language: python
    always_run: true
    pass_filenames: false
    additional_dependencies: []
